<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kártyatár">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Kártyatár</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Belépés -->
    <section id="view-login" hidden>
      <div class="login">
        <div class="login-logo">🃏</div>
        <h1 class="title">Kártyatár</h1>
        <p class="muted">Jelentkezz be, hogy a kártyáid minden eszközödön ott legyenek.</p>
        <button id="login-btn" class="big"><span class="g">G</span> Belépés Google-fiókkal</button>
        <p id="login-error" class="err" role="alert"></p>
      </div>
    </section>

    <!-- Kártyák fül -->
    <section id="view-decks">
      <h1 class="title">Kártyák</h1>
      <form id="deck-form" class="inline-form">
        <input id="deck-name" placeholder="Új pakli neve" required maxlength="60">
        <button type="submit">Létrehozás</button>
      </form>
      <ul id="deck-list" class="deck-list"></ul>
    </section>

    <section id="view-deck" hidden>
      <div class="deck-top">
        <button id="back-btn" class="ghost small">‹ Vissza</button>
        <button id="delete-deck-btn" class="danger small">Pakli törlése</button>
      </div>
      <h1 id="deck-title" class="title"></h1>
      <p id="deck-stats" class="muted"></p>
      <button id="study-btn" class="big">Tanulás</button>
      <form id="card-form" class="card-form">
        <label>Előlap <textarea id="card-front" rows="2" required></textarea></label>
        <label>Hátlap <textarea id="card-back" rows="2" required></textarea></label>
        <button type="submit">Kártya hozzáadása</button>
      </form>
      <ul id="card-list" class="card-list"></ul>
    </section>

    <section id="view-study" hidden>
      <div class="study-bar">
        <button id="exit-study-btn" class="ghost small">Kilépés</button>
        <span id="study-progress" class="muted"></span>
      </div>
      <div id="flashcard" class="flashcard" tabindex="0" role="button" aria-label="Kártya megfordítása">
        <p id="card-text"></p>
      </div>
      <div id="show-wrap" class="answer-row">
        <button id="show-btn" class="big">Válasz mutatása <kbd>Szóköz</kbd></button>
      </div>
      <div id="rate-wrap" class="answer-row rate" hidden>
        <button data-rating="again" class="r-again">Újra <small id="t-again"></small></button>
        <button data-rating="hard" class="r-hard">Nehéz <small id="t-hard"></small></button>
        <button data-rating="good" class="r-good">Jó <small id="t-good"></small></button>
        <button data-rating="easy" class="r-easy">Könnyű <small id="t-easy"></small></button>
      </div>
      <p id="study-done" class="done" hidden>Mára végeztél ebben a pakliban.</p>
    </section>

    <!-- Játékok fül -->
    <section id="view-games" hidden>
      <h1 class="title">Játékok</h1>
      <label class="select-label">Pakli <select id="games-deck"></select></label>
      <p id="games-msg" class="err" role="alert"></p>
      <ul id="game-list" class="game-list"></ul>
    </section>

    <section id="view-game" hidden>
      <div class="study-bar">
        <button id="exit-game-btn" class="ghost small">Kilépés</button>
        <strong id="game-title"></strong>
        <span id="game-score" class="muted"></span>
      </div>
      <div id="game-area"></div>
    </section>

    <!-- Beállítások fül -->
    <section id="view-settings" hidden>
      <h1 class="title">Beállítások</h1>
      <ul class="settings-list">
        <li><span>Szinkron</span><span id="sync-status" class="muted" role="status"></span></li>
        <li><span>Fiók</span><span id="account-email" class="muted"></span></li>
        <li><button id="logout-btn" class="ghost">Kijelentkezés</button></li>
        <li><label>Kiejtés nyelve (hallgatós kvíz)
          <select id="lang-select">
            <option value="en-US">Angol (US)</option><option value="en-GB">Angol (UK)</option>
            <option value="de-DE">Német</option><option value="es-ES">Spanyol</option>
            <option value="fr-FR">Francia</option><option value="it-IT">Olasz</option>
          </select></label></li>
        <li><button id="export-btn" class="ghost">Exportálás (JSON)</button></li>
        <li><label class="ghost btn-like">Importálás<input type="file" id="import-input" accept="application/json" hidden></label></li>
      </ul>
    </section>
  </main>

  <nav class="tabbar" aria-label="Fő navigáció">
    <button data-tab="decks" class="active"><span class="ic">🃏</span>Kártyák</button>
    <button data-tab="games"><span class="ic">🎮</span>Játékok</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Beállítások</button>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="games.js"></script>
</body>
</html>
