<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d4fd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FlashCards">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>FlashCards – The easy way to master new words.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="home-link" tabindex="0">FlashCards</h1>
    <div class="top-actions">
      <span id="sync-status" class="muted" role="status"></span>
      <button id="settings-btn" class="ghost">Database</button>
      <button id="export-btn" class="ghost">Export</button>
      <label class="ghost btn-like">Import<input type="file" id="import-input" accept="application/json" hidden></label>
    </div>
  </header>

  <main>
    <!-- Paklik listája -->
    <section id="view-decks">
      <form id="deck-form" class="inline-form">
        <input id="deck-name" placeholder="Name of the new deck, e.g., English words" required maxlength="60">
        <button type="submit">Create a Deck</button>
      </form>
      <ul id="deck-list" class="deck-list"></ul>
    </section>

    <!-- Egy pakli részletei -->
    <section id="view-deck" hidden>
      <div class="deck-head">
        <div>
          <button id="back-btn" class="ghost small">Back</button>
          <h2 id="deck-title"></h2>
          <p id="deck-stats" class="muted"></p>
        </div>
        <div class="deck-head-actions">
          <button id="study-btn">Learning</button>
          <button id="delete-deck-btn" class="danger small">Delete deck</button>
        </div>
      </div>

      <form id="card-form" class="card-form">
        <label>Front <textarea id="card-front" rows="2" required></textarea></label>
        <label>Back <textarea id="card-back" rows="2" required></textarea></label>
        <button type="submit">Add card</button>
      </form>

      <ul id="card-list" class="card-list"></ul>
    </section>

    <!-- Tanulás -->
    <section id="view-study" hidden>
      <div class="study-bar">
        <button id="exit-study-btn" class="ghost small">Exit</button>
        <span id="study-progress" class="muted"></span>
      </div>
      <div id="flashcard" class="flashcard" tabindex="0" role="button" aria-label="Flipping the card over">
        <p id="card-text"></p>
      </div>
      <div id="show-wrap" class="answer-row">
        <button id="show-btn">Show answer <kbd>Space</kbd></button>
      </div>
      <div id="rate-wrap" class="answer-row rate" hidden>
        <button data-rating="again" class="r-again">Again <small id="t-again"></small></button>
        <button data-rating="hard" class="r-hard">Difficult <small id="t-hard"></small></button>
        <button data-rating="good" class="r-good">Good <small id="t-good"></small></button>
        <button data-rating="easy" class="r-easy">Easy <small id="t-easy"></small></button>
      </div>
      <p id="study-done" class="done" hidden>You're done with this deck for today.</p>
    </section>
  </main>

  <dialog id="settings-dialog">
    <h2>Supabase connection</h2>
    <p class="muted">The key is stored only in this browser; it is not committed to the repository.</p>
    <label>Project URL <input id="cfg-url" placeholder="https://xxxx.supabase.co"></label>
    <label>Anon / publishable key <input id="cfg-key" autocomplete="off"></label>
    <p id="cfg-error" class="err" role="alert"></p>
    <div class="dialog-actions">
      <button id="cfg-cancel" class="ghost" type="button">Cancel</button>
      <button id="cfg-save" type="button">Save</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
