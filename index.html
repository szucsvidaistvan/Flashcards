<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flashcards">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Login -->
    <section id="view-login" hidden>
      <div class="login">
        <div class="login-logo">🃏</div>
        <h1 class="title">Flashcards</h1>
        <p class="muted">Sign in to keep your cards in sync on all your devices.</p>
        <button id="login-btn" class="big"><span class="g">G</span> Sign in with Google</button>
        <p id="login-error" class="err" role="alert"></p>
      </div>
    </section>

    <!-- Cards tab -->
    <section id="view-decks">
      <h1 class="title">Cards</h1>
      <form id="deck-form" class="inline-form">
        <input id="deck-name" placeholder="New deck name" required maxlength="60">
        <button type="submit">Create</button>
      </form>
      <ul id="deck-list" class="deck-list"></ul>
    </section>

    <section id="view-deck" hidden>
      <div class="deck-top">
        <button id="back-btn" class="ghost small">‹ Back</button>
        <button id="delete-deck-btn" class="danger small">Delete deck</button>
      </div>
      <h1 id="deck-title" class="title"></h1>
      <p id="deck-stats" class="muted"></p>
      <button id="study-btn" class="big">Study</button>
      <form id="card-form" class="card-form">
        <label>Front <textarea id="card-front" rows="2" required></textarea></label>
        <label>Back <textarea id="card-back" rows="2" required></textarea></label>
        <button type="submit">Add card</button>
      </form>
      <ul id="card-list" class="card-list"></ul>
    </section>

    <section id="view-study" hidden>
      <div class="study-bar">
        <button id="exit-study-btn" class="ghost small">Exit</button>
        <span id="study-progress" class="muted"></span>
        <button id="play-btn" class="ghost small" aria-label="Play audio" hidden>🔊</button>
      </div>
      <div id="flashcard" class="flashcard" tabindex="0" role="button" aria-label="Flip card">
        <p id="card-text"></p>
      </div>
      <div id="show-wrap" class="answer-row">
        <button id="show-btn" class="big">Show answer <kbd>Space</kbd></button>
      </div>
      <div id="rate-wrap" class="answer-row rate" hidden>
        <button data-rating="again" class="r-again">Again <small id="t-again"></small></button>
        <button data-rating="hard" class="r-hard">Hard <small id="t-hard"></small></button>
        <button data-rating="good" class="r-good">Good <small id="t-good"></small></button>
        <button data-rating="easy" class="r-easy">Easy <small id="t-easy"></small></button>
      </div>
      <p id="study-done" class="done" hidden>You're done with this deck for today.</p>
    </section>

    <!-- Games tab -->
    <section id="view-games" hidden>
      <h1 class="title">Games</h1>
      <label class="select-label">Deck <select id="games-deck"></select></label>
      <p id="games-msg" class="err" role="alert"></p>
      <ul id="game-list" class="game-list"></ul>
    </section>

    <section id="view-game" hidden>
      <div class="study-bar">
        <button id="exit-game-btn" class="ghost small">Exit</button>
        <strong id="game-title"></strong>
        <span id="game-score" class="muted"></span>
      </div>
      <div id="game-area"></div>
    </section>

    <!-- Settings tab -->
    <section id="view-settings" hidden>
      <h1 class="title">Settings</h1>
      <ul class="settings-list">
        <li><span>Sync</span><span id="sync-status" class="muted" role="status"></span></li>
        <li><span>Account</span><span id="account-email" class="muted"></span></li>
        <li><button id="logout-btn" class="ghost">Sign out</button></li>
        <li><label>Pronunciation language (audio quiz)
          <select id="lang-select">
            <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option>
            <option value="de-DE">German</option><option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option><option value="it-IT">Italian</option>
          </select></label></li>
        <li><label class="row">Autoplay audio <input type="checkbox" id="autoplay" checked></label></li>
        <li><button id="export-btn" class="ghost">Export (JSON)</button></li>
        <li><label class="ghost btn-like">Import (JSON or Anki .apkg)<input type="file" id="import-input" hidden></label></li>
      </ul>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main navigation">
    <button data-tab="decks" class="active"><span class="ic">🃏</span>Cards</button>
    <button data-tab="games"><span class="ic">🎮</span>Games</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Settings</button>
  </nav>

  <dialog id="apkg-dialog">
    <h2>Import Anki deck</h2>
    <p id="apkg-msg" class="muted"></p>
    <button id="apkg-all" class="ghost small" type="button">Select all / none</button>
    <div id="apkg-list" class="apkg-list"></div>
    <div class="dialog-actions">
      <button id="apkg-cancel" class="ghost" type="button">Close</button>
      <button id="apkg-import" type="button" disabled>Import</button>
    </div>
  </dialog>

  <script src="app.js"></script>
  <script src="games.js"></script>
  <script src="audio.js"></script>
  <script src="anki.js"></script>
</body>
</html>
